name: Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to GitHub Releases
        type: boolean
        default: false
      notes:
        description: Release notes (optional, Markdown)
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/NxToWin/NxToWin.csproj -Raw
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid app version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet build NxToWin.slnx -c Release
      - run: dotnet run --project tests/NxToWin.ProtocolChecks -c Release --no-build
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/NxToWin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NxToWin-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ runner.temp }}/NxToWin/NxToWin-Setup.exe
            ${{ runner.temp }}/NxToWin/NxToWin.Desktop-${{ steps.version.outputs.version }}-full.nupkg
            ${{ runner.temp }}/NxToWin/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: package
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NxToWin-${{ needs.package.outputs.version }}-win-x64
      - name: Publish the tested installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:RELEASE_VERSION"
          $assets = @('NxToWin-Setup.exe', "NxToWin.Desktop-$env:RELEASE_VERSION-full.nupkg", 'SHA256SUMS.txt')
          $release = gh release list --limit 100 --json tagName,isDraft --jq ".[] | select(.tagName == `"$tag`")"
          if ($release) {
            $draft = gh release view $tag --json isDraft,targetCommitish | ConvertFrom-Json
            if (!$draft.isDraft -or $draft.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Release $tag already exists or targets a different commit."
            }
            gh release upload $tag @assets --clobber
          }
          else {
            $notes = @('--generate-notes')
            if (![string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
              $notesPath = Join-Path $env:RUNNER_TEMP 'NxToWin-release-notes.md'
              Set-Content -LiteralPath $notesPath -Value $env:RELEASE_NOTES -NoNewline
              $notes = @('--notes-file', $notesPath)
            }
            gh release create $tag @assets --draft --title "NxToWin $env:RELEASE_VERSION" --target $env:GITHUB_SHA @notes
          }
          gh release edit $tag --draft=false --latest
          if ((gh release view $tag --json isImmutable --jq .isImmutable) -ne 'true') { throw "Release $tag is not immutable." }
